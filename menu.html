<main id="menu-container"></main>

<main>  
    <section>
        <h2>Індивідуальне замовлення торта</h2>
            <div class="item">
                <img src="img/custom_cake.jpg" alt="Індивідуальний торт">
                <p>Ціна залежить від вибору</p>

                <form id="custom-cake-form">
                    <select id="cake-size" required>
                      <option value="">Оберіть розмір</option>
                      <option value="Малий">Малий (500грн)</option>
                      <option value="Середній">Середній (1000грн)</option>
                      <option value="Великий">Великий (1500грн)</option>
                    </select>
                  
                    <select id="cake-filling" required>
                      <option value="">Оберіть начинку</option>
                      <option value="Шоколадна">Шоколадна</option>
                      <option value="Ванільна">Ванільна</option>
                      <option value="Вишнено-малинова">Вишнено-малинова</option>
                      <option value="Пломбірна">Пломбірна</option>
                      <option value="Цитрусова">Цитрусова</option>
                    </select>
                  
                    <textarea id="cake-decor" placeholder="Ваші побажання щодо декору (необов'язково)"  required ></textarea>
                  
                    <button type="submit" class="btn">Замовити</button>
                  </form>
                  

                <script>
                        function addCustomCakeToCart(event) {
                        event.preventDefault(); // щоб форма не перезавантажувала сторінку
                        alert("Торт додано до кошика!");
                    }

                    document.addEventListener("DOMContentLoaded", function () {
                        document
                        .querySelector("#custom-cake-form")
                        .addEventListener("submit", addCustomCakeToCart);
                    });
                  </script>

            </div>
          
    </section>
</main>
